name: CI

# Pull-request gate. Push-to-main is gated by docker-publish.yml (which also
# builds + publishes the image); PRs run no CI without this workflow. Both
# delegate the actual backend + frontend + audit jobs to the reusable
# tests.yml so the gates live in exactly one place.

on:
  pull_request:
    branches: [main]

# Cancel an in-flight run when a PR gets a new push: only the latest commit
# needs validating, and PR CI (unlike the publish workflow) is safe to preempt.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
