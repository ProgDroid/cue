name: gen-lock

# Throwaway: regenerate a Linux-complete frontend/package-lock.json so the
# Docker build can use strict `npm ci`. A lock authored on Windows omits the
# Linux/musl optional deps (@emnapi/*, rollup musl bindings). Run once via the
# Actions tab / `gh workflow run gen-lock.yml`, then DELETE this workflow.
on: workflow_dispatch

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate Linux-complete lockfile
        working-directory: frontend
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore: regenerate cross-platform package-lock.json on linux [skip ci]" || echo "no changes"
          git push
