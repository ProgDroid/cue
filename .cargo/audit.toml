# cargo-audit configuration (read automatically by `cargo audit` from the repo root).
#
# cargo-audit scans Cargo.lock, NOT the compiled build graph, so it flags crates
# that are present in the lockfile via optional, unactivated features even though
# rustc never compiles them.

[advisories]
# RUSTSEC-2023-0071 — "Marvin Attack" timing sidechannel in the `rsa` crate.
# No fixed upgrade is available upstream. `rsa` only enters Cargo.lock as a
# transitive dependency of `sqlx-mysql` / `sqlx-postgres`, which the `sqlx`
# metapackage lists as optional backends. cue enables only the `sqlite` feature,
# so those backends — and `rsa` — are NEVER compiled into any cue binary
# (verified: `cargo tree -i rsa --target all` returns nothing). The vulnerable
# code path does not exist in the shipped artifact, so this advisory is not
# exploitable here. Re-evaluate if cue ever adds a MySQL/Postgres backend.
ignore = ["RUSTSEC-2023-0071"]
